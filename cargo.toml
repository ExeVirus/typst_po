[package]
name = "typst_po"
version = "0.1.0"
edition = "2021"
description = "Gettext .pot extractor and translation builder for Typst"

[[bin]]
name = "typ2pot"
path = "src/bin/typ2pot.rs"

[[bin]]
name = "typ-translate"
path = "src/bin/typ_translate.rs"

[dependencies]
typst-syntax = "0.13"
clap = { version = "4.5", features = ["derive"] }
walkdir = "2.5"
anyhow = "1.0"